[versions]
junit = "6.1.3"
picocli = "4.7.7"
jgit = "7.8.0.202609011348-r"
jackson = "2.19.2"
javaparser = "3.28.2"
spotless = "7.2.1"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
