# Commit this in a consuming repository and pass --policy-file changeradar.yml
# (or the Action input policy-file). Nothing is enabled until listed here or
# passed as --policy. Seed a baseline once so pre-existing public API does
# not fail the first run:
#   java -jar changeradar.jar analyze --base "$BASE" --head "$HEAD" \
#     --policy-file changeradar.yml --write-baseline .changeradar/baseline.txt
# Seed finding suppressions (one id per line) the same way:
#   java -jar changeradar.jar analyze --base "$BASE" --head "$HEAD" \
#     --write-suppressions .changeradar/suppress.txt
policies:
  - breaking-public-java-api
  # - breaking-public-export
  # - breaking-public-python
  # - breaking-public-php
  # - analysis-unavailable
  # - failed-related-tests   # requires --junit / Action junit:
baseline: .changeradar/baseline.txt
suppressions: .changeradar/suppress.txt
