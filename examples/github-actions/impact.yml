# Copy into a consuming repository. Pin this Action to a commit SHA the same
# way you pin actions/checkout. `version` is a ChangeRadar *release tag* whose
# assets include changeradar.jar. Do not run Gradle of this project in
# consumer CI.
name: ChangeRadar

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch PR SHAs
        run: |
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      # Pin to a SHA of AnikethTS/ChangeRadar that contains action.yml, not a moving tag.
      - uses: AnikethTS/ChangeRadar@2fcffb7ae933a6d7086417f5597e9b25ad616a64
        with:
          version: latest
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          format: compact,markdown,json,sarif,github
          output: build/changeradar
          # policy: breaking-public-java-api,analysis-unavailable
          # policy-file: changeradar.yml
          # classpath: build/libs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: changeradar-report
          path: build/changeradar/
          if-no-files-found: warn
          retention-days: 14

      - name: Annotate changed files
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('build/changeradar/report.github.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - "$HEAD_SHA" <<'PY'
          import json
          import pathlib
          import sys

          head = sys.argv[1]
          payload = json.loads(pathlib.Path("build/changeradar/report.github.json").read_text())
          body = {
              "name": "ChangeRadar annotations",
              "head_sha": head,
              "status": "completed",
              "conclusion": "success",
              "output": {
                  "title": payload.get("title") or "ChangeRadar impact",
                  "summary": (payload.get("summary") or "")[:65000],
                  "annotations": (payload.get("annotations") or [])[:50],
              },
          }
          pathlib.Path("/tmp/changeradar-check.json").write_text(json.dumps(body))
          PY
          gh api --method POST "repos/${GH_REPO}/check-runs" --input /tmp/changeradar-check.json

  comment:
    name: Comment report
    needs: impact
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: changeradar-report
          path: build/changeradar

      - name: Post or update compact report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOGO_URL: https://raw.githubusercontent.com/AnikethTS/ChangeRadar/main/.github/logo.png
        run: |
          set -euo pipefail
          test -s build/changeradar/report.compact.md
          python3 - "$RUN_URL" "$LOGO_URL" <<'PY'
          import json
          import pathlib
          import sys

          run_url = sys.argv[1]
          logo_url = sys.argv[2]
          marker = "<!-- changeradar-report -->"
          report = pathlib.Path("build/changeradar/report.compact.md").read_text()
          header = (
              marker
              + "\n\n"
              + '<img src="'
              + logo_url
              + '" alt="ChangeRadar" width="220" />\n\n'
              + "Full Markdown, JSON, and SARIF: "
              + run_url
              + "\n\n"
          )
          pathlib.Path("/tmp/changeradar-comment.json").write_text(
              json.dumps({"body": header + report})
          )
          PY
          COMMENT_ID="$(
            gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login=="github-actions[bot]" and (.body | contains("<!-- changeradar-report -->"))) | .id' \
              | awk 'NF { print; exit }'
          )"
          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" \
              --input /tmp/changeradar-comment.json
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --input /tmp/changeradar-comment.json
          fi
