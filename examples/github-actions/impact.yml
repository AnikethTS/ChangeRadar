# Copy into a consuming repository. Do not clone ChangeRadar or run its Gradle.
#
# Two version knobs:
# 1. uses: …@<sha> — Action wrapper (Java, download, report). Pin a SHA.
# 2. version: — analyzer JAR. Omit (or latest) for GitHub's latest release.
#    Set version: v0.2.1 to pin a JAR.
#
# Artifact upload, sticky PR comment, and Checks notices are inside the Action.
# Job needs checks: write and pull-requests: write for those (fork PRs skip them).
#
# Java callers: compile in THIS workflow, then pass classpath. ChangeRadar
# does not run the target build.
name: ChangeRadar

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Wrapper SHA that posts artifact, comment, and Checks notices. JAR defaults to latest.
      - uses: AnikethTS/ChangeRadar@b8254081360d2fb7eddb086dc8b6f07a76f78ade
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # version: v0.2.1
          # classpath: build/libs
          # policy-file: changeradar.yml
          # suppress-file: .changeradar/suppress.txt
