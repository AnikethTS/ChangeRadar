# Copy into a consuming repository. Do not clone ChangeRadar and run its Gradle.
#
# Two version knobs:
# 1. uses: …@<sha>  — the Action wrapper. Pin a SHA like actions/checkout.
# 2. version:         — analyzer JAR. Omit for GitHub's latest release.
#
# Java: compile in THIS workflow, then pass classpath. ChangeRadar will not
# run Maven/Gradle of the analyzed repo. Delete the compile steps if there
# is no JVM build.
name: ChangeRadar

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch PR SHAs
        run: |
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compile project jars
        run: ./gradlew assemble --no-daemon
        # Maven instead: mvn -B -DskipTests package
        # then classpath: target

      # Wrapper SHA on main after ship-quality 0.2.1. JAR defaults to latest.
      - uses: AnikethTS/ChangeRadar@53d4218a62ad4dd556a9da6e3bf571095b950a59
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          format: compact,markdown,json,sarif,github
          output: build/changeradar
          classpath: build/libs
          # version: v0.2.1
          # policy: breaking-public-java-api,analysis-unavailable
          # policy-file: changeradar.yml
          # suppress-file: .changeradar/suppress.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: changeradar-report
          path: build/changeradar/
          if-no-files-found: warn
          retention-days: 14

      - name: Annotate changed files
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('build/changeradar/report.github.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - "$HEAD_SHA" <<'PY'
          import json
          import pathlib
          import sys

          head = sys.argv[1]
          payload = json.loads(pathlib.Path("build/changeradar/report.github.json").read_text())
          body = {
              "name": "ChangeRadar annotations",
              "head_sha": head,
              "status": "completed",
              "conclusion": "success",
              "output": {
                  "title": payload.get("title") or "ChangeRadar impact",
                  "summary": (payload.get("summary") or "")[:65000],
                  "annotations": (payload.get("annotations") or [])[:50],
              },
          }
          pathlib.Path("/tmp/changeradar-check.json").write_text(json.dumps(body))
          PY
          gh api --method POST "repos/${GH_REPO}/check-runs" --input /tmp/changeradar-check.json

  comment:
    name: Comment report
    needs: impact
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: changeradar-report
          path: build/changeradar

      - name: Post or update compact report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOGO_URL: https://raw.githubusercontent.com/AnikethTS/ChangeRadar/main/.github/logo.png
        run: |
          set -euo pipefail
          test -s build/changeradar/report.compact.md
          python3 - "$RUN_URL" "$LOGO_URL" <<'PY'
          import json
          import pathlib
          import sys

          run_url = sys.argv[1]
          logo_url = sys.argv[2]
          marker = "<!-- changeradar-report -->"
          report = pathlib.Path("build/changeradar/report.compact.md").read_text()
          header = (
              marker
              + "\n\n"
              + '<img src="'
              + logo_url
              + '" alt="ChangeRadar" width="220" />\n\n'
              + "Full Markdown, JSON, and SARIF: "
              + run_url
              + "\n\n"
          )
          pathlib.Path("/tmp/changeradar-comment.json").write_text(
              json.dumps({"body": header + report})
          )
          PY
          COMMENT_ID="$(
            gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login=="github-actions[bot]" and (.body | contains("<!-- changeradar-report -->"))) | .id' \
              | awk 'NF { print; exit }'
          )"
          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" \
              --input /tmp/changeradar-comment.json
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --input /tmp/changeradar-comment.json
          fi
