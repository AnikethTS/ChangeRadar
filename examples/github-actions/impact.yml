# Copy into a consuming repository (or call ChangeRadar from this
# repository's own CI). Least privilege: contents: read is enough to
# analyze. Pin third-party actions to SHAs in production copies.
name: ChangeRadar

on:
  pull_request:

permissions:
  contents: read

jobs:
  impact:
    name: Impact report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Analyze base..head
        run: |
          ./run.sh analyze \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --format markdown,json \
            --output build/changeradar
          # Opt in to blocking, for example:
          #   --policy breaking-public-java-api
          #   --policy breaking-public-export
          #   --policy breaking-public-python
          #   --policy breaking-public-php
          #   --policy analysis-unavailable

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: changeradar-report
          path: build/changeradar/
          if-no-files-found: warn
          retention-days: 14
