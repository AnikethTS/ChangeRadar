name: ChangeRadar Impact Analysis
description: Download a ChangeRadar release JAR, analyze a Git base..head diff, and post the report.
author: AnikethTS
branding:
  icon: activity
  color: purple
inputs:
  base:
    description: Base Git SHA
    required: true
  head:
    description: Head Git SHA
    required: true
  version:
    description: >
      Analyzer JAR to download when jar is empty. Default latest uses GitHub's
      latest published release. Set a tag (v0.2.6) to pin a specific JAR.
    required: false
    default: latest
  jar:
    description: Local changeradar.jar path. If set, the Action does not download a release.
    required: false
    default: ""
  output:
    description: Report directory
    required: false
    default: build/changeradar
  format:
    description: Comma-separated formats
    required: false
    default: compact,markdown,json,sarif,github,html
  policy:
    description: Optional comma-separated --policy names
    required: false
    default: ""
  policy-file:
    description: Optional --policy-file path
    required: false
    default: ""
  classpath:
    description: >
      Already-built jars or directories of jars for Java type resolution
      (path-separator-separated). From a previous compile step in this
      workflow. ChangeRadar does not run the target build.
    required: false
    default: ""
  suppress-file:
    description: Optional --suppress-file path (one finding id per line)
    required: false
    default: ""
  coverage:
    description: >
      JaCoCo XML or LCOV file, or a directory of those files. Intersects
      suite coverage with changed lines. ChangeRadar does not run tests.
    required: false
    default: ""
  junit:
    description: >
      JUnit XML file or directory of TEST-*.xml. Annotates recommended
      tests with pass/fail. ChangeRadar does not run tests.
    required: false
    default: ""
  comment:
    description: Post or update a sticky PR comment (same-repo pull requests only)
    required: false
    default: "true"
  annotate:
    description: Post Checks API notice annotations (same-repo pull requests only)
    required: false
    default: "true"
  upload:
    description: Upload the report directory as artifact changeradar-report
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Fetch analysis SHAs
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "${{ inputs.base }}" "${{ inputs.head }}" || true

    - name: Resolve ChangeRadar JAR
      shell: bash
      env:
        INPUT_JAR: ${{ inputs.jar }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p "${{ github.action_path }}/.changeradar-dist"
        DEST="${{ github.action_path }}/.changeradar-dist/changeradar.jar"
        if [ -n "${INPUT_JAR}" ]; then
          if [ -f "${INPUT_JAR}" ]; then
            cp "${INPUT_JAR}" "${DEST}"
          elif [ -f "${GITHUB_WORKSPACE}/${INPUT_JAR}" ]; then
            cp "${GITHUB_WORKSPACE}/${INPUT_JAR}" "${DEST}"
          else
            echo "changeradar: jar not found: ${INPUT_JAR}" >&2
            exit 2
          fi
        elif [ -z "${INPUT_VERSION}" ] || [ "${INPUT_VERSION}" = "latest" ]; then
          echo "changeradar: downloading latest changeradar.jar"
          curl -fsSL -o "${DEST}" \
            "https://github.com/AnikethTS/ChangeRadar/releases/latest/download/changeradar.jar"
        else
          echo "changeradar: downloading changeradar.jar from ${INPUT_VERSION}"
          curl -fsSL -o "${DEST}" \
            "https://github.com/AnikethTS/ChangeRadar/releases/download/${INPUT_VERSION}/changeradar.jar"
        fi
        test -s "${DEST}"
        echo "CHANGERADAR_JAR=${DEST}" >> "${GITHUB_ENV}"

    - name: Analyze
      shell: bash
      run: |
        set -euo pipefail
        ARGS=(
          analyze
          --base "${{ inputs.base }}"
          --head "${{ inputs.head }}"
          --format "${{ inputs.format }}"
          --output "${{ inputs.output }}"
        )
        if [ -n "${{ inputs.policy }}" ]; then
          ARGS+=(--policy "${{ inputs.policy }}")
        fi
        if [ -n "${{ inputs.policy-file }}" ]; then
          ARGS+=(--policy-file "${{ inputs.policy-file }}")
        fi
        if [ -n "${{ inputs.classpath }}" ]; then
          ARGS+=(--classpath "${{ inputs.classpath }}")
        fi
        if [ -n "${{ inputs.suppress-file }}" ]; then
          ARGS+=(--suppress-file "${{ inputs.suppress-file }}")
        fi
        if [ -n "${{ inputs.coverage }}" ]; then
          ARGS+=(--coverage "${{ inputs.coverage }}")
        fi
        if [ -n "${{ inputs.junit }}" ]; then
          ARGS+=(--junit "${{ inputs.junit }}")
        fi
        java -jar "${CHANGERADAR_JAR}" "${ARGS[@]}"

    - name: Upload report
      if: ${{ always() && inputs.upload != 'false' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: changeradar-report
        path: ${{ inputs.output }}/
        if-no-files-found: warn
        retention-days: 14

    - name: Annotate changed files
      if: ${{ always() && inputs.annotate != 'false' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash "${{ github.action_path }}/.github/scripts/changeradar-annotate.sh" \
          "${{ inputs.output }}" "${{ inputs.head }}"

    - name: Post or update compact report comment
      if: ${{ always() && inputs.comment != 'false' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        REPO="${ACTION_REPO:-${{ github.repository }}}"
        REF="${ACTION_REF:-${{ github.sha }}}"
        LOGO="https://raw.githubusercontent.com/${REPO}/${REF}/.github/logo-comment.png"
        bash "${{ github.action_path }}/.github/scripts/changeradar-comment.sh" \
          "${{ inputs.output }}" \
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          "${LOGO}" \
          "${{ github.event.pull_request.number }}"
