name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint workflow YAML
        run: actionlint -color -shellcheck shellcheck

      - name: Lint Action scripts
        run: |
          shellcheck -x \
            .github/scripts/changeradar-annotate.sh \
            .github/scripts/changeradar-comment.sh

      - name: Lint action.yml
        run: |
          python3 -m venv "${RUNNER_TEMP}/action-schema"
          "${RUNNER_TEMP}/action-schema/bin/pip" install --quiet check-jsonschema
          "${RUNNER_TEMP}/action-schema/bin/check-jsonschema" \
            --schemafile https://json.schemastore.org/github-action.json \
            action.yml

  wrapper-validation:
    name: Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  check:
    name: Check (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["21", "25"]
        include:
          # Previous GitHub-hosted images (Java 21 is the consumer floor).
          # There is no windows-10 runner; windows-2022 is NT 10.0 (Win10/11 family).
          - os: ubuntu-24.04
            java: "21"
          - os: ubuntu-22.04
            java: "21"
          - os: windows-2022
            java: "21"
          - os: macos-15
            java: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Tests and formatting
        run: ./gradlew check --no-daemon --stacktrace --continue

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  cli-smoke:
    name: CLI smoke (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["21", "25"]
        include:
          - os: ubuntu-24.04
            java: "21"
          - os: ubuntu-22.04
            java: "21"
          - os: windows-2022
            java: "21"
          - os: macos-15
            java: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Help and version (Gradle and fat JAR)
        run: |
          ./run.sh --help
          ./run.sh --version
          ./gradlew :changeradar-cli:shadowJar --quiet --no-daemon
          test -s changeradar-cli/build/libs/changeradar.jar
          java -jar changeradar-cli/build/libs/changeradar.jar --help
          java -jar changeradar-cli/build/libs/changeradar.jar --version

      - name: Analyze this repository with the fat JAR
        run: |
          if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            BASE=HEAD~1
          else
            BASE=HEAD
          fi
          java -jar changeradar-cli/build/libs/changeradar.jar analyze \
            --base "${BASE}" \
            --head HEAD \
            --format terminal,markdown,json,compact,sarif,github,html \
            --output build/changeradar
          test -s build/changeradar/report.json
          test -s build/changeradar/report.md
          test -s build/changeradar/report.compact.md
          test -s build/changeradar/report.sarif
          test -s build/changeradar/report.github.json
          test -s build/changeradar/report.html
          if command -v python3 >/dev/null; then PY=python3; else PY=python; fi
          "${PY}" -m venv "${RUNNER_TEMP}/schema-venv"
          if [ -x "${RUNNER_TEMP}/schema-venv/bin/pip" ]; then
            VENV="${RUNNER_TEMP}/schema-venv/bin"
          else
            VENV="${RUNNER_TEMP}/schema-venv/Scripts"
          fi
          "${VENV}/pip" install --quiet check-jsonschema
          "${VENV}/check-jsonschema" --schemafile schemas/report-v1.schema.json \
            build/changeradar/report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: changeradar-smoke-${{ matrix.os }}-jdk${{ matrix.java }}
          path: build/changeradar/
          if-no-files-found: error
          retention-days: 7

  # Stable names for Protect main required checks (matrix cells change).
  check-required:
    name: Check
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Check cell to succeed
        run: test "${{ needs.check.result }}" = success

  cli-smoke-required:
    name: CLI smoke
    if: always()
    needs: [cli-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CLI smoke cell to succeed
        run: test "${{ needs.cli-smoke.result }}" = success

  ci:
    name: CI
    if: always()
    needs: [actionlint, wrapper-validation, check, cli-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every required job to succeed
        run: |
          test "${{ needs.actionlint.result }}" = success
          test "${{ needs.wrapper-validation.result }}" = success
          test "${{ needs.check.result }}" = success
          test "${{ needs.cli-smoke.result }}" = success
