name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  plan:
    name: CI · Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.plan.outputs.fast }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -eu
          has() { echo "$LABELS" | jq -e --arg l "$1" 'index($l) != null' >/dev/null 2>&1; }
          full=false
          if [ "$EVENT" != "pull_request" ] || has ci:full; then
            full=true
          fi
          {
            echo "fast=true"
            echo "full=${full}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  actionlint:
    name: actionlint
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint workflow YAML
        run: actionlint -color -shellcheck shellcheck

      - name: Lint Action scripts
        run: |
          shellcheck -x \
            .github/scripts/changeradar-annotate.sh \
            .github/scripts/changeradar-comment.sh

      - name: Lint action.yml
        run: |
          python3 -m venv "${RUNNER_TEMP}/action-schema"
          "${RUNNER_TEMP}/action-schema/bin/pip" install --quiet check-jsonschema
          "${RUNNER_TEMP}/action-schema/bin/check-jsonschema" \
            --schemafile https://json.schemastore.org/github-action.json \
            action.yml

  wrapper-validation:
    name: Gradle Wrapper
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  gitleaks:
    name: Security · Secret scan
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  check-fast:
    name: Check · Ubuntu latest · Java 21
    needs: plan
    if: needs.plan.outputs.fast == 'true' && needs.plan.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tests and formatting
        run: ./gradlew check --no-daemon --stacktrace --continue

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-ubuntu-latest-jdk21
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  check:
    name: Check (Java ${{ matrix.java }}, ${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["21", "25"]
        include:
          # Previous GitHub-hosted images (Java 21 is the consumer floor).
          # There is no windows-10 runner; windows-2022 is NT 10.0 (Win10/11 family).
          - os: ubuntu-24.04
            java: "21"
          - os: ubuntu-22.04
            java: "21"
          - os: windows-2022
            java: "21"
          - os: macos-15
            java: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tests and formatting
        run: ./gradlew check --no-daemon --stacktrace --continue

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  cli-smoke-fast:
    name: CLI smoke · Ubuntu latest · Java 21
    needs: plan
    if: needs.plan.outputs.fast == 'true' && needs.plan.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Help and version (Gradle and fat JAR)
        run: |
          ./run.sh --help
          ./run.sh --version
          ./gradlew :changeradar-cli:shadowJar --quiet --no-daemon
          test -s changeradar-cli/build/libs/changeradar.jar
          java -jar changeradar-cli/build/libs/changeradar.jar --help
          java -jar changeradar-cli/build/libs/changeradar.jar --version

      - name: Analyze this repository with the fat JAR
        run: |
          if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            BASE=HEAD~1
          else
            BASE=HEAD
          fi
          java -jar changeradar-cli/build/libs/changeradar.jar analyze \
            --base "${BASE}" \
            --head HEAD \
            --format terminal,markdown,json,compact,sarif,github,html \
            --output build/changeradar
          test -s build/changeradar/report.json
          test -s build/changeradar/report.md
          test -s build/changeradar/report.compact.md
          test -s build/changeradar/report.sarif
          test -s build/changeradar/report.github.json
          test -s build/changeradar/report.html
          python3 -m venv "${RUNNER_TEMP}/schema-venv"
          "${RUNNER_TEMP}/schema-venv/bin/pip" install --quiet check-jsonschema
          "${RUNNER_TEMP}/schema-venv/bin/check-jsonschema" \
            --schemafile schemas/report-v1.schema.json \
            build/changeradar/report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: changeradar-smoke-ubuntu-latest-jdk21
          path: build/changeradar/
          if-no-files-found: error
          retention-days: 7

  cli-smoke:
    name: CLI smoke (Java ${{ matrix.java }}, ${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["21", "25"]
        include:
          - os: ubuntu-24.04
            java: "21"
          - os: ubuntu-22.04
            java: "21"
          - os: windows-2022
            java: "21"
          - os: macos-15
            java: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Help and version (Gradle and fat JAR)
        run: |
          ./run.sh --help
          ./run.sh --version
          ./gradlew :changeradar-cli:shadowJar --quiet --no-daemon
          test -s changeradar-cli/build/libs/changeradar.jar
          java -jar changeradar-cli/build/libs/changeradar.jar --help
          java -jar changeradar-cli/build/libs/changeradar.jar --version

      - name: Analyze this repository with the fat JAR
        run: |
          if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            BASE=HEAD~1
          else
            BASE=HEAD
          fi
          java -jar changeradar-cli/build/libs/changeradar.jar analyze \
            --base "${BASE}" \
            --head HEAD \
            --format terminal,markdown,json,compact,sarif,github,html \
            --output build/changeradar
          test -s build/changeradar/report.json
          test -s build/changeradar/report.md
          test -s build/changeradar/report.compact.md
          test -s build/changeradar/report.sarif
          test -s build/changeradar/report.github.json
          test -s build/changeradar/report.html
          if command -v python3 >/dev/null; then PY=python3; else PY=python; fi
          "${PY}" -m venv "${RUNNER_TEMP}/schema-venv"
          if [ -x "${RUNNER_TEMP}/schema-venv/bin/pip" ]; then
            VENV="${RUNNER_TEMP}/schema-venv/bin"
          else
            VENV="${RUNNER_TEMP}/schema-venv/Scripts"
          fi
          "${VENV}/pip" install --quiet check-jsonschema
          "${VENV}/check-jsonschema" --schemafile schemas/report-v1.schema.json \
            build/changeradar/report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: changeradar-smoke-${{ matrix.os }}-jdk${{ matrix.java }}
          path: build/changeradar/
          if-no-files-found: error
          retention-days: 7

  # Stable names for Protect main required checks (matrix cells change).
  check-required:
    name: Check
    if: always()
    needs: [plan, check, check-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Check jobs for this plan to succeed
        env:
          FULL: ${{ needs.plan.outputs.full }}
          CHECK: ${{ needs.check.result }}
          FAST: ${{ needs.check-fast.result }}
        run: |
          set -eu
          if [ "$FULL" = "true" ]; then
            test "$CHECK" = success
          else
            test "$FAST" = success
          fi

  cli-smoke-required:
    name: CLI smoke
    if: always()
    needs: [plan, cli-smoke, cli-smoke-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CLI smoke cell to succeed
        env:
          FULL: ${{ needs.plan.outputs.full }}
          SMOKE: ${{ needs.cli-smoke.result }}
          FAST: ${{ needs.cli-smoke-fast.result }}
        run: |
          set -eu
          if [ "$FULL" = "true" ]; then
            test "$SMOKE" = success
          else
            test "$FAST" = success
          fi

  ci:
    name: CI
    if: always()
    needs: [plan, actionlint, wrapper-validation, gitleaks, check-fast, check, cli-smoke-fast, cli-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the jobs for this plan to succeed
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ needs.plan.outputs.full }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: $failed"
            exit 1
          fi
          if [ "$FULL" = "true" ]; then
            for job in actionlint wrapper-validation gitleaks check cli-smoke; do
              result="$(echo "$NEEDS" | jq -r --arg job "$job" '.[$job].result')"
              if [ "$result" != "success" ]; then
                echo "::error::${job} result is ${result}"
                exit 1
              fi
            done
            exit 0
          fi
          for job in actionlint wrapper-validation gitleaks check-fast cli-smoke-fast; do
            result="$(echo "$NEEDS" | jq -r --arg job "$job" '.[$job].result')"
            if [ "$result" != "success" ]; then
              echo "::error::${job} result is ${result}"
              exit 1
            fi
          done
          if [ "$EVENT" = "pull_request" ]; then
            echo "::error::Add the ci:full label to run the full Java matrix and CLI smoke before merging."
            exit 1
          fi
