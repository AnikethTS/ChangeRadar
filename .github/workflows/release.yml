# Attaches changeradar.jar to a GitHub Release so consumer CI can
# `java -jar` it (or use action.yml) instead of cloning this repo.
name: Release JAR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach changeradar.jar to (for example v0.2.8)
        required: true

permissions:
  contents: read

jobs:
  jar:
    name: Upload changeradar.jar
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build fat JAR
        run: ./gradlew :changeradar-cli:shadowJar --no-daemon

      - name: Checksum the JAR
        run: |
          cp changeradar-cli/build/libs/changeradar.jar changeradar.jar
          sha256sum changeradar.jar > changeradar.jar.sha256

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: changeradar.jar

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" changeradar.jar.sigstore.json
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            changeradar.jar \
            changeradar.jar.sha256 \
            changeradar.jar.sigstore.json \
            --clobber
