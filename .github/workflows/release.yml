# Attaches changeradar.jar to a GitHub Release so consumer CI can
# `java -jar` it (or use action.yml) instead of cloning this repo.
name: Release JAR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach changeradar.jar to (for example v0.2.4)
        required: true

permissions:
  contents: write

jobs:
  jar:
    name: Upload changeradar.jar
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build fat JAR
        run: ./gradlew :changeradar-cli:shadowJar --no-daemon

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s changeradar-cli/build/libs/changeradar.jar
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            changeradar-cli/build/libs/changeradar.jar \
            --clobber
