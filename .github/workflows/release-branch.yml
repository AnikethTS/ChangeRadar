# main fast-forwards `release`. A new VERSION on `release` publishes
# GitHub Release vX.Y.Z; Release JAR then uploads changeradar.jar.
name: Release branch

on:
  push:
    branches: [main, release]

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  sync:
    name: Fast-forward release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push HEAD to release
        run: git push origin "HEAD:refs/heads/release"

  publish:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create release if VERSION is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="$(tr -d '[:space:]' < VERSION)"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "changeradar: VERSION is not x.y.z: ${VERSION}"
              exit 1
              ;;
          esac
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "changeradar: ${TAG} already exists; skip"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "changeradar: GitHub Release ${TAG} already exists; skip"
            exit 0
          fi
          NOTES="$(mktemp)"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            printf 'Analyzer JAR for %s. See CHANGELOG.md.\n' "$TAG" > "$NOTES"
          fi
          gh release create "$TAG" \
            --title "ChangeRadar ${VERSION}" \
            --target release \
            --notes-file "$NOTES"
