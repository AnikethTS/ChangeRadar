# Dogfood this repository: build changeradar.jar, run tests, pass JaCoCo
# and JUnit XML into the composite Action. Consumers copy
# examples/github-actions/impact.yml (pin uses: to a SHA; JAR defaults to
# latest). Artifact, sticky comment, and Checks notices are inside the Action.
name: ChangeRadar

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build fat JAR, tests, and coverage
        run: ./gradlew assemble :changeradar-cli:shadowJar collectTestEvidence --no-daemon

      - uses: ./
        with:
          jar: changeradar-cli/build/libs/changeradar.jar
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          format: compact,markdown,json,sarif,github
          output: build/changeradar
          classpath: changeradar-core/build/libs:changeradar-git/build/libs:changeradar-analyzer-java/build/libs:changeradar-analyzer-kotlin/build/libs:changeradar-analyzer-typescript/build/libs:changeradar-analyzer-python/build/libs:changeradar-analyzer-php/build/libs:changeradar-analyzer-sql/build/libs:changeradar-analyzer-workflow/build/libs:changeradar-analyzer-shell/build/libs:changeradar-cli/build/libs
          coverage: build/test-evidence/coverage
          junit: build/test-evidence/junit
